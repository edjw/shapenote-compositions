name: Copy PDFs to Blog Repository

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'compositions/finished/**/*.pdf'
      - 'compositions/finished/**/*.ly'
      - '.github/workflows/pdf-webhook.yml'
      - '.pdfdates'
      - '.pdfignore'
      - 'scripts/shapenote_pdf_manifest.py'
      - 'tests/test_shapenote_pdf_manifest.py'
  workflow_dispatch:

jobs:
  copy-pdfs-to-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout shapenote-compositions repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: shapenote-compositions

      - name: Test PDF manifest
        working-directory: shapenote-compositions
        run: python3 -m unittest discover -s tests -p 'test_shapenote_pdf_manifest.py' -v

      - name: Checkout blog repository
        uses: actions/checkout@v6
        with:
          repository: edjw/edjw-blog-astro
          token: ${{ secrets.BLOG_REPO_TOKEN }}
          path: blog

      - name: Sync PDFs and manifest to blog
        id: sync-files
        run: |
          cd shapenote-compositions

          # The source repo is authoritative. Regenerate the public PDF directory
          # and manifest from all finished PDFs so deletes, renames, and metadata
          # changes never require manual blog edits.
          BLOG_PDF_DIR="../blog/public/files/shapenote-compositions"
          BLOG_MANIFEST="../blog/src/data/shapenote-compositions.json"

          mkdir -p "$(dirname "$BLOG_MANIFEST")"
          python3 scripts/shapenote_pdf_manifest.py manifest > "$BLOG_MANIFEST"

          PDF_FILES=$(python3 - <<'PY'
          import pathlib
          import sys

          sys.path.insert(0, "scripts")
          import shapenote_pdf_manifest

          repo_root = pathlib.Path.cwd()
          for pdf_path in shapenote_pdf_manifest.find_pdfs(repo_root):
              print(shapenote_pdf_manifest.repo_path(pdf_path, repo_root))
          PY
          )

          rm -rf "$BLOG_PDF_DIR"
          mkdir -p "$BLOG_PDF_DIR"

          COPIED_FILES=""
          if [ -z "$PDF_FILES" ]; then
            echo "No PDF files to copy; wrote empty manifest"
          else
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              FILENAME=$(basename "$file")
              NEW_FILENAME=$(python3 scripts/shapenote_pdf_manifest.py filename "$file")

              cp "$file" "$BLOG_PDF_DIR/$NEW_FILENAME"
              echo "Copied: $FILENAME -> $NEW_FILENAME"
              COPIED_FILES="$COPIED_FILES$NEW_FILENAME, "
            done <<< "$PDF_FILES"
          fi

          COPIED_FILES=${COPIED_FILES%, }
          echo "copied_files=$COPIED_FILES" >> $GITHUB_OUTPUT
          echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push to blog repository
        if: steps.sync-files.outputs.has_changes == 'true'
        run: |
          cd blog
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public/files/shapenote-compositions/ src/data/shapenote-compositions.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          COMMIT_MSG="Update shapenote composition PDFs and manifest"
          if [ -n "${{ steps.sync-files.outputs.copied_files }}" ]; then
            COMMIT_MSG="$COMMIT_MSG - Synced: ${{ steps.sync-files.outputs.copied_files }}"
          fi

          git commit -m "$COMMIT_MSG"
          git push
