name: Copy PDFs to Blog Repository

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'compositions/finished/**/*.pdf'
  workflow_dispatch:

jobs:
  copy-pdfs-to-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout shapenote-compositions repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          path: shapenote-compositions

      - name: Checkout blog repository
        uses: actions/checkout@v4
        with:
          repository: edjw/edjw-blog-astro
          token: ${{ secrets.BLOG_REPO_TOKEN }}
          path: blog

      - name: Get changed PDF files and copy to blog
        id: copy-files
        run: |
          cd shapenote-compositions

          # Check if this is a manual trigger
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected - copying all PDF files"
            CHANGED_PDFS=$(find compositions/finished -name "*.pdf" -type f)
          else
            echo "Automatic trigger - copying only changed PDF files"
            CHANGED_PDFS=$(git diff --name-only HEAD^ HEAD | grep '^compositions/finished/.*\.pdf$' || true)
          fi

          if [ -z "$CHANGED_PDFS" ]; then
            echo "No PDF files to copy"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT
          mkdir -p ../blog/public/files/shapenote-compositions

          COPIED_FILES=""
          for file in $CHANGED_PDFS; do
            if [ -f "$file" ]; then
              # Get file modification date in YYYY-MM-DD format
              MOD_DATE=$(date -d "@$(stat -c %Y "$file")" +%Y-%m-%d)

              # Extract filename without extension
              FILENAME=$(basename "$file")
              BASENAME="${FILENAME%.pdf}"

              # Remove any existing date pattern (YYYY-MM-DD or DD-MM-YYYY or similar)
              BASENAME_CLEAN=$(echo "$BASENAME" | sed -E 's/_?[0-9]{4}-[0-9]{2}-[0-9]{2}$//; s/_?[0-9]{2}-[0-9]{2}-[0-9]{4}$//')

              # Construct new filename with modification date
              NEW_FILENAME="${BASENAME_CLEAN}_${MOD_DATE}.pdf"

              cp "$file" "../blog/public/files/shapenote-compositions/$NEW_FILENAME"
              echo "Copied: $FILENAME -> $NEW_FILENAME"
              COPIED_FILES="$COPIED_FILES$NEW_FILENAME, "
            fi
          done

          COPIED_FILES=${COPIED_FILES%, }
          echo "copied_files=$COPIED_FILES" >> $GITHUB_OUTPUT

      - name: Commit and push to blog repository
        if: steps.copy-files.outputs.has_changes == 'true'
        run: |
          cd blog
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/files/shapenote-compositions/*.pdf

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update shapenote composition PDFs: ${{ steps.copy-files.outputs.copied_files }}"
          git push
