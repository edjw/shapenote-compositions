[project]
name = "shapenote-songbook"
version = "0.1.0"
description = "Compose vector songbook PDFs from finished shape-note scores"
requires-python = ">=3.12"
dependencies = [
  "pymupdf>=1.26.0,<2",
]

[project.scripts]
songbook-pdf = "shapenote_songbook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["songbook/engine/shapenote_songbook"]

[tool.basedpyright]
include = ["songbook/engine", "tests/songbook"]
exclude = ["**/__pycache__"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportUnusedCallResult = "error"
reportUnusedParameter = "error"
reportUnnecessaryTypeIgnoreComment = "error"
failOnWarnings = true

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
]
